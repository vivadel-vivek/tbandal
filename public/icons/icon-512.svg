<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Two Buds and a Leaf">
  <!-- Maskable-safe: all foreground inside the inner 80% safe zone (centered 410×410 box). -->
  <rect width="512" height="512" fill="#FAF7F2"/>
  <!-- Subtle warm-paper rim so the icon reads on white OS surfaces too. -->
  <rect x="6" y="6" width="500" height="500" rx="64" ry="64" fill="none" stroke="#E8E5E2" stroke-width="2"/>

  <!-- Centered "Two buds and a leaf" mark, scaled to ~360px tall inside the safe zone. -->
  <g transform="translate(106 76) scale(5.15625)" fill="none" stroke="#722F37" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Stem -->
    <path d="M32 56 C 32 44, 32 32, 32 18"/>
    <!-- Left bud -->
    <path d="M32 30 C 24 28, 18 22, 18 14 C 24 14, 30 18, 32 26" fill="#722F37" fill-opacity="0.18"/>
    <!-- Right bud -->
    <path d="M32 24 C 40 22, 46 16, 46 8 C 40 8, 34 12, 32 20" fill="#722F37" fill-opacity="0.18"/>
    <!-- Leaf — gold accent -->
    <path d="M32 18 C 28 10, 32 4, 32 4 C 32 4, 36 10, 32 18 Z" fill="#C4A35A" fill-opacity="0.55" stroke="#A68B3D"/>
    <!-- Leaf vein -->
    <path d="M32 6 L 32 16" stroke="#A68B3D" stroke-width="1.2"/>
  </g>
</svg>
