# Two Buds and a Leaf — Supabase project config.
#
# This file is the source of truth for the local development stack
# (`supabase start` reads it). Run `supabase init` once to verify
# defaults; we keep our edits here so the values survive `init` runs.
#
# project_id is the slug we hand to the CLI. The hosted project ref
# stays in `.supabase/` (gitignored, written by `supabase link`).

project_id = "two-buds-and-a-leaf"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Match the hosted project's Postgres version. Bumped from 15 → 17 after
# `supabase link` reported the remote major version was newer.
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
# Local email tester. The signup confirmation + password-reset emails
# Supabase generates land here in dev — http://127.0.0.1:54324
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Production site URL — this is what Supabase substitutes into auth
# emails (invite, password reset, magic link). Localhost is added to
# the allow-list below so dev still works.
site_url = "https://two-buds-and-a-leaf.vercel.app"
additional_redirect_urls = [
  "https://two-buds-and-a-leaf.vercel.app",
  "https://two-buds-and-a-leaf.vercel.app/**",
  "http://localhost:3000",
  "http://localhost:3000/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false  # set true once we wire a real SMTP for prod
secure_password_change = false
max_frequency = "1s"

# OAuth providers can be enabled later — keep the flags off so dev
# doesn't break on missing client IDs.
[auth.external.apple]
enabled = false

[auth.external.google]
enabled = false

[edge_runtime]
enabled = false
policy = "oneshot"
inspector_port = 8083
